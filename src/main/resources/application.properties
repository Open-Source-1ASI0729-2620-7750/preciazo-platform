spring.application.name=preciazo-web-services
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
documentation.application.version=@project.version@
documentation.application.description=Preciazo RESTful API built with Spring Boot 4, Java 27, DDD, CQRS and JWT authentication for multi-store grocery price comparison, shopping lists, optimized routes, merchant management and community verification.
authorization.jwt.secret=${JWT_SECRET:Preciazo2026SuperSecretSigningKeyForJwtAuthenticationAtLeast64Chars!}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
preciazo.routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
preciazo.routing.osrm.enabled=${OSRM_ENABLED:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
